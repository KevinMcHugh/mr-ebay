openapi: 3.0.3
info:
  title: Mr. eBay API
  description: |
    Saved eBay searches, the listings they find, and their price history.
    See docs/design.md. This spec is the HTTP surface's source of truth:
    `make generate` turns it into internal/api/gen.

    Every operation needs a credential unless it says `security: []`: an
    `mre_` api key or `mre_at_` access token as `Authorization: Bearer ...`,
    or the web session cookie. A missing or unknown credential gets a 401
    whose WWW-Authenticate header points at OAuth discovery, which is how an
    MCP client such as claude.ai starts the connector flow.
  version: 0.1.0

servers:
  - url: /api

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /me:
    get:
      operationId: getMe
      summary: The api key this request acts as
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /searches:
    get:
      operationId: listSearches
      summary: List saved searches, newest first
      responses:
        "200":
          description: The searches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSearch
      summary: Save a search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCreate"
      responses:
        "201":
          description: The saved search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /searches/{searchId}:
    parameters:
      - $ref: "#/components/parameters/SearchId"
    get:
      operationId: getSearch
      summary: One saved search
      responses:
        "200":
          description: The search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSearch
      summary: Change a saved search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchUpdate"
      responses:
        "200":
          description: The updated search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteSearch
      summary: Delete a saved search
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An mre_ api key, or an mre_at_ OAuth access token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: mre_session
      description: The web session set by /login.

  parameters:
    SearchId:
      name: searchId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No credential, or one that is unknown, expired or revoked
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: The request parsed but a field is out of bounds
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Me:
      type: object
      required: [keyId, name]
      properties:
        keyId:
          type: string
        name:
          type: string
          description: The label the key was minted with.

    Search:
      type: object
      required: [id, name, query, categoryIds, conditions, buyingOptions, currency, marketplace, wants, watch, newCount, createdAt, updatedAt, url]
      properties:
        id:
          type: string
        name:
          type: string
        query:
          type: string
          description: eBay keywords.
        categoryIds:
          type: array
          items:
            type: string
        conditions:
          type: array
          description: Any of NEW, USED, UNSPECIFIED; empty for any condition.
          items:
            type: string
        buyingOptions:
          type: array
          description: Any of FIXED_PRICE, AUCTION, BEST_OFFER; empty for any.
          items:
            type: string
        minPriceCents:
          type: integer
          format: int64
          description: Omitted when there is no minimum.
        maxPriceCents:
          type: integer
          format: int64
          description: Omitted when there is no maximum.
        currency:
          type: string
        marketplace:
          type: string
        wants:
          type: string
          description: What you are after, in words, for the judgment calls a filter cannot make.
        watch:
          type: boolean
          description: Run unattended on the watch schedule.
        alertBelowCents:
          type: integer
          format: int64
          description: A watched search alerts on matches at or below this total. Omitted to alert on every new match.
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          x-go-type-skip-optional-pointer: false
        newCount:
          type: integer
          description: Matches not yet looked at.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
          description: The search's web page.

    SearchList:
      type: object
      required: [searches]
      properties:
        searches:
          type: array
          items:
            $ref: "#/components/schemas/Search"

    SearchCreate:
      type: object
      description: Prices are in cents of currency; 0 or omitted means no limit.
      required: [name, query]
      properties:
        name:
          type: string
        query:
          type: string
        categoryIds:
          type: array
          items:
            type: string
        conditions:
          type: array
          items:
            type: string
        buyingOptions:
          type: array
          items:
            type: string
        minPriceCents:
          type: integer
          format: int64
        maxPriceCents:
          type: integer
          format: int64
        currency:
          type: string
          description: Default USD.
        marketplace:
          type: string
          description: Default EBAY_US.
        wants:
          type: string
        watch:
          type: boolean
        alertBelowCents:
          type: integer
          format: int64

    SearchUpdate:
      type: object
      description: Fields left out are left alone. A price of 0 removes that limit.
      properties:
        name:
          type: string
          x-go-type-skip-optional-pointer: false
        query:
          type: string
          x-go-type-skip-optional-pointer: false
        categoryIds:
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: false
        conditions:
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: false
        buyingOptions:
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: false
        minPriceCents:
          type: integer
          format: int64
          x-go-type-skip-optional-pointer: false
        maxPriceCents:
          type: integer
          format: int64
          x-go-type-skip-optional-pointer: false
        currency:
          type: string
          x-go-type-skip-optional-pointer: false
        marketplace:
          type: string
          x-go-type-skip-optional-pointer: false
        wants:
          type: string
          x-go-type-skip-optional-pointer: false
        watch:
          type: boolean
          x-go-type-skip-optional-pointer: false
        alertBelowCents:
          type: integer
          format: int64
          x-go-type-skip-optional-pointer: false
